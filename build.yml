name: Build prank exe
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --noconsole --name prank --add-data "video.mp4;." --add-data "audio.wav;." --hidden-import pycaw.pycaw --hidden-import comtypes prank.py
      - uses: actions/upload-artifact@v4
        with:
          name: prank-exe
          path: dist/prank.exe
